<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امتحان الرخصة الدولية للصف الثامن ICDL 2026 - مدارس الرضوان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132A46;
    --navy-2:#1E3A5F;
    --teal:#0E7C86;
    --teal-light:#E4F3F3;
    --gold:#C9A94F;
    --bg:#F5F7F9;
    --surface:#FFFFFF;
    --border:#DCE3E9;
    --text:#1B2733;
    --text-soft:#57687A;
    --good:#1F8A57;
    --good-bg:#EAF7EF;
    --bad:#C0392B;
    --bad-bg:#FBEAE8;
    --radius:14px;
    --shadow: 0 8px 24px rgba(19,42,70,0.08);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg:#0F1720;
      --surface:#182634;
      --border:#2A3B4D;
      --text:#EAF0F5;
      --text-soft:#9DB0C2;
      --teal-light:#123236;
      --good-bg:#12301F;
      --bad-bg:#331A17;
      --shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1720;
    --surface:#182634;
    --border:#2A3B4D;
    --text:#EAF0F5;
    --text-soft:#9DB0C2;
    --teal-light:#123236;
    --good-bg:#12301F;
    --bad-bg:#331A17;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal', Tahoma, Arial, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Cairo', Tahoma, Arial, sans-serif; }

  .app{max-width:920px;margin:0 auto;padding:0 20px 60px;}

  /* ---------- header ---------- */
  header.top{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:22px 0;
    margin-bottom:28px;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 90% -10%, rgba(201,169,79,0.25), transparent 55%),
      radial-gradient(circle at -5% 120%, rgba(14,124,134,0.35), transparent 55%);
    pointer-events:none;
  }
  .top-inner{
    max-width:920px;margin:0 auto;padding:0 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    position:relative; z-index:1; flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand svg{flex-shrink:0;}
  .brand-text .school{font-weight:800;font-size:1.15rem;letter-spacing:.2px;}
  .brand-text .exam-title{font-size:.85rem;color:#CFE0E8;margin-top:2px;}
  .timer-chip{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:999px;
    padding:8px 18px;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:1.05rem;
    display:flex; align-items:center; gap:8px;
    letter-spacing:.5px;
  }
  .timer-chip.warn{ background:rgba(192,57,43,0.35); border-color:rgba(192,57,43,0.6); }
  .timer-chip .dot{width:8px;height:8px;border-radius:50%;background:#5CD6B0;}
  .timer-chip.warn .dot{background:#FF8A73;}

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px;
    margin-bottom:20px;
  }
  .muted{color:var(--text-soft);}
  .lede{font-size:1.02rem;line-height:1.9;color:var(--text-soft);}

  .badge-row{display:flex; gap:12px; flex-wrap:wrap; margin:20px 0;}
  .stat{
    flex:1; min-width:130px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    background:var(--teal-light);
  }
  .stat .n{font-family:'Cairo',sans-serif; font-weight:800; font-size:1.5rem; color:var(--navy-2);}
  :root[data-theme="dark"] .stat .n, :root:not([data-theme="light"]) .stat .n{ color:#8FD8DA; }
  .stat .l{font-size:.85rem; color:var(--text-soft); margin-top:2px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; cursor:pointer;
    font-family:'Cairo',sans-serif; font-weight:700; font-size:1rem;
    padding:13px 26px; border-radius:10px;
    transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{ background:var(--teal); color:#fff; box-shadow:0 4px 14px rgba(14,124,134,0.35); }
  .btn-primary:hover{ background:#0B6971; }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .btn-outline{ background:transparent; color:var(--navy-2); border:1.5px solid var(--border); }
  :root[data-theme="dark"] .btn-outline, :root:not([data-theme="light"]) .btn-outline{ color:#EAF0F5; }
  .btn-outline:hover{ border-color:var(--teal); color:var(--teal); }
  .btn-danger{ background:transparent; color:var(--bad); border:1.5px solid var(--bad); }
  .btn-danger:hover{ background:var(--bad-bg); }
  .btn-sm{ padding:8px 16px; font-size:.9rem; }
  .btn-block{width:100%;}

  input[type=text], input[type=password], textarea{
    width:100%;
    font-family:'Tajawal',sans-serif;
    font-size:1rem;
    padding:12px 14px;
    border-radius:8px;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--text);
  }
  input:focus, textarea:focus{ outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal); }
  label{ font-weight:700; font-size:.92rem; display:block; margin-bottom:6px; }

  .link-btn{ background:none; border:none; color:var(--text-soft); text-decoration:underline; cursor:pointer; font-family:'Tajawal',sans-serif; font-size:.9rem; padding:6px; }
  .link-btn:hover{ color:var(--teal); }

  /* ---------- exam ---------- */
  .progress-wrap{ margin-bottom:22px; }
  .progress-track{ height:8px; background:var(--border); border-radius:999px; overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--teal),var(--navy-2)); border-radius:999px; transition:width .25s ease; }
  .progress-meta{ display:flex; justify-content:space-between; font-size:.85rem; color:var(--text-soft); margin-top:8px; }

  .qnum-chip{
    display:inline-block; background:var(--teal-light); color:var(--navy-2);
    font-family:'Cairo',sans-serif; font-weight:700; font-size:.85rem;
    padding:5px 14px; border-radius:999px; margin-bottom:14px;
  }
  :root[data-theme="dark"] .qnum-chip, :root:not([data-theme="light"]) .qnum-chip{ color:#8FD8DA; }
  .qtext{ font-size:1.18rem; line-height:1.75; font-weight:700; margin:0 0 22px; }

  .options{ display:flex; flex-direction:column; gap:12px; }
  .option{
    display:flex; align-items:flex-start; gap:12px;
    border:1.5px solid var(--border); border-radius:10px;
    padding:14px 16px; cursor:pointer;
    transition: border-color .12s ease, background .12s ease;
  }
  .option:hover{ border-color:var(--teal); }
  .option.selected{ border-color:var(--teal); background:var(--teal-light); }
  .option input{ margin-top:3px; accent-color:var(--teal); flex-shrink:0; width:18px; height:18px; }
  .option .opt-letter{
    font-family:'Cairo',sans-serif; font-weight:800; color:var(--navy-2);
    flex-shrink:0; width:22px;
  }
  :root[data-theme="dark"] .option .opt-letter, :root:not([data-theme="light"]) .option .opt-letter{ color:#8FD8DA; }
  .option .opt-text{ line-height:1.6; }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:26px; gap:10px; flex-wrap:wrap; }
  .nav-row .side{ display:flex; gap:10px; }

  .qgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:8px; margin-top:18px; }
  .qgrid button{
    aspect-ratio:1; border-radius:8px; border:1.5px solid var(--border); background:var(--surface);
    font-family:'Cairo',sans-serif; font-weight:700; color:var(--text-soft); cursor:pointer; font-size:.85rem;
  }
  .qgrid button.answered{ border-color:var(--teal); color:var(--teal); background:var(--teal-light); }
  .qgrid button.current{ background:var(--navy-2); color:#fff; border-color:var(--navy-2); }

  /* ---------- results ---------- */
  .score-hero{ text-align:center; padding:10px 0 6px; }
  .score-ring{
    width:150px;height:150px;border-radius:50%;
    margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:conic-gradient(var(--teal) calc(var(--pct)*1%), var(--border) 0);
    position:relative;
  }
  .score-ring::before{
    content:""; position:absolute; inset:10px; background:var(--surface); border-radius:50%;
  }
  .score-ring .val{ position:relative; font-family:'Cairo',sans-serif; font-weight:800; font-size:2rem; color:var(--navy-2); }
  :root[data-theme="dark"] .score-ring .val, :root:not([data-theme="light"]) .score-ring .val{ color:#8FD8DA; }
  .score-ring .sub{ position:relative; font-size:.8rem; color:var(--text-soft); }
  .pass-tag{
    display:inline-block; font-family:'Cairo',sans-serif; font-weight:700;
    padding:6px 18px; border-radius:999px; font-size:.95rem; margin-top:6px;
  }
  .pass-tag.pass{ background:var(--good-bg); color:var(--good); }
  .pass-tag.fail{ background:var(--bad-bg); color:var(--bad); }

  .review-item{ border:1.5px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .review-item.ok{ border-color:var(--good); background:var(--good-bg); }
  .review-item.no{ border-color:var(--bad); background:var(--bad-bg); }
  .review-q{ font-weight:700; margin-bottom:10px; display:flex; gap:10px; align-items:flex-start; }
  .review-icon{ flex-shrink:0; font-family:'Cairo',sans-serif; font-weight:800; }
  .review-item.ok .review-icon{ color:var(--good); }
  .review-item.no .review-icon{ color:var(--bad); }
  .review-line{ font-size:.92rem; margin:4px 0 4px 32px; color:var(--text-soft); }
  .review-line b{ color:var(--text); font-weight:700; }
  .review-line.correct-ans b{ color:var(--good); }
  .review-line.your-wrong b{ color:var(--bad); }

  /* ---------- admin ---------- */
  .admin-lock{ max-width:380px; margin:60px auto; text-align:center; }
  .admin-q-item{ border:1.5px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  .admin-q-item .row{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .admin-opt-line{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .admin-opt-line input[type=radio]{ accent-color:var(--good); width:18px; height:18px; flex-shrink:0; }
  .field{ margin-bottom:16px; }
  .admin-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
  .pill{ font-size:.78rem; padding:3px 10px; border-radius:999px; background:var(--teal-light); color:var(--navy-2); font-weight:700; font-family:'Cairo',sans-serif; }
  :root[data-theme="dark"] .pill, :root:not([data-theme="light"]) .pill{ color:#8FD8DA; }
  .toast{
    position:fixed; bottom:24px; right:50%; transform:translateX(50%);
    background:var(--navy); color:#fff; padding:12px 22px; border-radius:10px;
    font-size:.92rem; box-shadow:var(--shadow); z-index:50; opacity:0; pointer-events:none;
    transition:opacity .2s ease, bottom .2s ease;
  }
  .toast.show{ opacity:1; bottom:34px; }

  footer.appfoot{ text-align:center; color:var(--text-soft); font-size:.82rem; padding:24px 0 6px; }

  @media (max-width:560px){
    .card{padding:20px;}
    .qtext{font-size:1.05rem;}
    .brand-text .school{font-size:1rem;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M23 2 L43 10 V22 C43 33 35 41 23 44 C11 41 3 33 3 22 V10 Z" fill="#C9A94F" opacity="0.95"/>
        <path d="M23 6 L39 12.5 V22 C39 31 32.5 37.5 23 40 C13.5 37.5 7 31 7 22 V12.5 Z" fill="#0E7C86"/>
        <text x="23" y="29" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">ر</text>
      </svg>
      <div class="brand-text">
        <div class="school">مدارس الرضوان</div>
        <div class="exam-title">امتحان الرخصة الدولية للصف الثامن ICDL — دورة 2026</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button id="copyLinkBtn" class="timer-chip" style="cursor:pointer;" title="نسخ رابط الامتحان لمشاركته مع الطلاب">
        <span>🔗</span> نسخ الرابط
      </button>
      <div id="timerSlot"></div>
    </div>
  </div>
</header>

<div class="app" id="app"></div>

<footer class="appfoot">مدارس الرضوان © محاكاة امتحان ICDL — لأغراض تدريبية</footer>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   DATA
========================================================= */

  // No account or sign-in is required to use this page. Question data lives
  // either in this browser's local storage (after a teacher edit on this
  // device) or falls back to the questions baked into the page itself.
  let loaded = null;
  try{
    const raw = localStorage.getItem("icdl_exam_bank_2026");
    if(raw) loaded = JSON.parse(raw);
  }catch(e){}
  STATE.bank = loaded && loaded.length ? loaded : DEFAULT_QUESTIONS;
}

async function persistBank(newBank){
  STATE.bank = newBank;
  try{ localStorage.setItem("icdl_exam_bank_2026", JSON.stringify(newBank)); }catch(e){}
  return false;
}

/* =========================================================
   HELPERS
========================================================= */
const LETTERS = ["أ","ب","ج","د"];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildAttemptQuestions(bank){
  // shuffle question order, and shuffle each question's options while tracking the correct index
  return shuffle(bank).map(q=>{
    const optIdx = q.options.map((t,i)=>({t,i}));
    const shuffledOpts = shuffle(optIdx);
    return {
      id: q.id,
      text: q.text,
      options: shuffledOpts.map(o=>o.t),
      correct: shuffledOpts.findIndex(o=>o.i===q.correct)
    };
  });
}

function fmtTime(s){
  const m = Math.floor(s/60).toString().padStart(2,"0");
  const sec = (s%60).toString().padStart(2,"0");
  return `${m}:${sec}`;
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._id);
  showToast._id = setTimeout(()=>t.classList.remove("show"), 2200);
}

function el(html){
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

   RENDER: ROOT
========================================================= */
function render(){
  const app = document.getElementById("app");
  const timerSlot = document.getElementById("timerSlot");
  timerSlot.innerHTML = "";

  if(STATE.view === "exam" && !STATE.submitted){
    const warn = STATE.timeLeft <= 5*60;
    timerSlot.appendChild(el(`
      <div class="timer-chip ${warn?'warn':''}">
        <span class="dot"></span> الوقت المتبقي: ${fmtTime(STATE.timeLeft)}
      </div>
    `));
  }

  if(STATE.view === "start") return renderStart(app);
  if(STATE.view === "exam") return renderExam(app);
  if(STATE.view === "results") return renderResults(app);
  if(STATE.view === "admin-lock") return renderAdminLock(app);
  if(STATE.view === "admin") return renderAdmin(app);
}

        <li>لديك ${EXAM_MINUTES} دقيقة لإكمال جميع الأسئلة، وينتهي الامتحان تلقائياً عند انتهاء الوقت.</li>
        <li>يمكنك التنقل بين الأسئلة والعودة لتغيير إجاباتك قبل التسليم.</li>
        <li>بعد التسليم ستظهر لك النتيجة وتصحيح كل سؤال فوراً.</li>
      </ul>

      <button class="btn btn-primary btn-block" id="startBtn">ابدأ الامتحان الآن</button>
    </div>
    <div style="text-align:center; margin-top:4px;">
      <button class="btn btn-outline" id="adminLink" style="gap:6px;">🔒 دخول المعلم / إدارة بنك الأسئلة</button>
    </div>
    </div>
  `));

  document.getElementById("studentName").addEventListener("input", e=>{ STATE.studentName = e.target.value; });
  document.getElementById("startBtn").addEventListener("click", startExam);
  document.getElementById("adminLink").addEventListener("click", ()=>{ STATE.view="admin-lock"; render(); });
}

function startExam(){
  if(!STATE.bank.length){ showToast("لا يوجد أسئلة متاحة حالياً"); return; }
  STATE.questions = buildAttemptQuestions(STATE.bank);
  STATE.answers = {};
  STATE.current = 0;
  STATE.timeLeft = EXAM_MINUTES*60;
  STATE.submitted = false;
  STATE.view = "exam";
  render();
  clearInterval(STATE.timerId);
  STATE.timerId = setInterval(()=>{
    STATE.timeLeft--;
    if(STATE.timeLeft <= 0){
      clearInterval(STATE.timerId);
      STATE.timeLeft = 0;
      finishExam();
      return;
    }
    // only refresh timer chip + warn state, avoid full re-render flicker
    const chipHost = document.getElementById("timerSlot");
    const warn = STATE.timeLeft <= 5*60;
    chipHost.innerHTML = "";
    chipHost.appendChild(el(`<div class="timer-chip ${warn?'warn':''}"><span class="dot"></span> الوقت المتبقي: ${fmtTime(STATE.timeLeft)}</div>`));
  },1000);
}

/* =========================================================
   VIEW: EXAM
========================================================= */
function renderExam(app){
  app.innerHTML = "";
  const total = STATE.questions.length;
  const q = STATE.questions[STATE.current];
  const answeredCount = Object.keys(STATE.answers).length;
  const pct = Math.round(((STATE.current+1)/total)*100);

  const card = el(`
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-meta">
          <span>السؤال ${STATE.current+1} من ${total}</span>
          <span>تمت الإجابة عن ${answeredCount} من ${total}</span>
        </div>
      </div>

      <div class="qnum-chip">السؤال ${STATE.current+1}</div>
      <p class="qtext">${q.text}</p>

      <div class="options" id="optionsWrap"></div>

      <div class="nav-row">
        <div class="side">
          <button class="btn btn-outline" id="prevBtn" ${STATE.current===0?"disabled":""}>السابق</button>
          ${STATE.current < total-1
            ? `<button class="btn btn-outline" id="nextBtn">التالي</button>`
            : ``}
        </div>
        <button class="btn btn-primary" id="submitBtn">إنهاء الامتحان وتسليمه</button>
      </div>

      <div class="qgrid" id="qgrid"></div>
    </div>
  `);
  app.appendChild(card);

  const optWrap = card.querySelector("#optionsWrap");
  q.options.forEach((opt, idx)=>{
    const selected = STATE.answers[q.id] === idx;
    const row = el(`
      <label class="option ${selected?'selected':''}">
        <input type="radio" name="opt" ${selected?"checked":""}>
        <span class="opt-letter">${LETTERS[idx]}.</span>
        <span class="opt-text">${opt}</span>
      </label>
    `);
    row.addEventListener("click", ()=>{
      STATE.answers[q.id] = idx;
      renderExam(app);
    });
    optWrap.appendChild(row);
  });

  const grid = card.querySelector("#qgrid");
  STATE.questions.forEach((qq,i)=>{
    const b = document.createElement("button");
    b.textContent = i+1;
    b.className = (i===STATE.current?"current ":"") + (STATE.answers[qq.id]!==undefined?"answered":"");
    b.addEventListener("click", ()=>{ STATE.current=i; render(); });
    grid.appendChild(b);
  });

  card.querySelector("#prevBtn")?.addEventListener("click", ()=>{ STATE.current--; render(); });
  card.querySelector("#nextBtn")?.addEventListener("click", ()=>{ STATE.current++; render(); });
  card.querySelector("#submitBtn").addEventListener("click", ()=>{
    if(answeredCount < total){
      if(!confirm(`لم تجب على ${total-answeredCount} سؤال/أسئلة بعد. هل تريد تسليم الامتحان الآن؟`)) return;
    } else {
      if(!confirm("هل أنت متأكد من تسليم الامتحان؟")) return;
    }
    finishExam();
  });
}

function finishExam(){
  clearInterval(STATE.timerId);
  STATE.submitted = true;
  STATE.view = "results";
  render();
}

/* =========================================================
   VIEW: RESULTS
========================================================= */
function renderResults(app){
  app.innerHTML = "";
  const total = STATE.questions.length;
  let correctCount = 0;
  const rows = STATE.questions.map(q=>{
    const chosen = STATE.answers[q.id];
    const isCorrect = chosen === q.correct;
    if(isCorrect) correctCount++;
    return {q, chosen, isCorrect};
  });
  const pct = Math.round((correctCount/total)*100);
  const passed = pct >= PASS_PERCENT;

  const card = el(`
    <div>
    <div class="card">
      <div class="score-hero">
        <div class="score-ring" style="--pct:${pct}">
          <div class="val">${pct}%</div>
          <div class="sub">${correctCount} من ${total}</div>
        </div>
        <div class="pass-tag ${passed?'pass':'fail'}">${passed ? "ناجح — مبروك!" : "غير مجتاز — حاول مجدداً"}</div>
        ${STATE.studentName ? `<p class="muted" style="margin-top:14px;">الطالب: ${STATE.studentName}</p>` : ``}
      </div>
      <div class="nav-row" style="justify-content:center; margin-top:24px;">
        <button class="btn btn-primary" id="retryBtn">إعادة الامتحان</button>
        <button class="btn btn-outline" id="homeBtn">العودة للصفحة الرئيسية</button>
      </div>
    </div>

    <h2 style="font-size:1.15rem; margin:24px 0 14px;">مراجعة الإجابات</h2>
    <div id="reviewList"></div>
    </div>
  `);
  app.appendChild(card);

  const list = card.querySelector("#reviewList");
  rows.forEach((r,i)=>{
    const item = el(`
      <div class="review-item ${r.isCorrect?'ok':'no'}">
        <div class="review-q"><span class="review-icon">${r.isCorrect?'✔':'✘'}</span><span>${i+1}. ${r.q.text}</span></div>
        <div class="review-line ${r.isCorrect?'':'your-wrong'}">إجابتك: <b>${r.chosen!==undefined ? LETTERS[r.chosen]+'. '+r.q.options[r.chosen] : 'لم تتم الإجابة'}</b></div>
        ${!r.isCorrect ? `<div class="review-line correct-ans">الإجابة الصحيحة: <b>${LETTERS[r.q.correct]}. ${r.q.options[r.q.correct]}</b></div>` : ``}
      </div>
    `);
    list.appendChild(item);
  });

  card.querySelector("#retryBtn").addEventListener("click", startExam);
  card.querySelector("#homeBtn").addEventListener("click", ()=>{ STATE.view="start"; render(); });
}

/* =========================================================
   VIEW: ADMIN
========================================================= */
function renderAdminLock(app){
  app.innerHTML = "";
  app.appendChild(el(`
    <div class="card admin-lock">
      <h2 style="margin-top:0;">دخول المعلم</h2>
      <p class="muted" style="margin-bottom:20px;">أدخل كلمة المرور للوصول إلى إدارة بنك الأسئلة (إضافة، تعديل، حذف).</p>
      <div class="field" style="text-align:right;">
        <input type="password" id="adminPass" placeholder="كلمة المرور">
      </div>
      <button class="btn btn-primary btn-block" id="adminEnter">دخول</button>
      <div style="margin-top:14px;"><button class="link-btn" id="backHome">رجوع</button></div>
    </div>
  `));
  document.getElementById("adminEnter").addEventListener("click", ()=>{
    const v = document.getElementById("adminPass").value;
    if(v === ADMIN_PASSWORD){ STATE.view="admin"; render(); }
    else showToast("كلمة المرور غير صحيحة");
  });
  document.getElementById("adminPass").addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("adminEnter").click(); });
  document.getElementById("backHome").addEventListener("click", ()=>{ STATE.view="start"; render(); });
}

function renderAdmin(app){
  app.innerHTML = "";
  const wrap = el(`
    <div>
      <div class="admin-toolbar">
        <div>
          <h2 style="margin:0;">إدارة بنك أسئلة ICDL</h2>
          <span class="pill">${STATE.bank.length} سؤال · محفوظ محلياً على هذا المتصفح فقط</span>
        </div>
        <div class="side" style="display:flex;gap:10px;">
          <button class="btn btn-primary btn-sm" id="addNewBtn">+ إضافة سؤال جديد</button>
          <button class="btn btn-outline btn-sm" id="exitAdmin">خروج</button>
        </div>
      </div>
      <div id="adminForm"></div>
      <div id="adminList"></div>
    </div>
  `);
  app.appendChild(wrap);

  document.getElementById("exitAdmin").addEventListener("click", ()=>{ STATE.view="start"; render(); });
  document.getElementById("addNewBtn").addEventListener("click", ()=>{
    STATE.adminEditing = "new";
    renderAdmin(app);
  });

  const formHost = wrap.querySelector("#adminForm");
  if(STATE.adminEditing){
    const editingExisting = STATE.adminEditing !== "new";
    const existing = editingExisting ? STATE.bank.find(q=>q.id===STATE.adminEditing) : {text:"",options:["","","",""],correct:0};
    formHost.appendChild(renderQuestionForm(existing, editingExisting ? STATE.adminEditing : null));
  }

  const listHost = wrap.querySelector("#adminList");
  STATE.bank.forEach((q,i)=>{
    const item = el(`
      <div class="admin-q-item">
        <div class="row">
          <div style="flex:1;">
            <b>${i+1}. ${q.text}</b>
            <ul style="margin:10px 0 0; padding-inline-start:20px; color:var(--text-soft); font-size:.92rem;">
              ${q.options.map((o,idx)=>`<li${idx===q.correct?' style="color:var(--good);font-weight:700;"':''}>${LETTERS[idx]}. ${o}${idx===q.correct?' ✔':''}</li>`).join("")}
            </ul>
          </div>
          <div class="side" style="display:flex;gap:8px;flex-shrink:0;">
            <button class="btn btn-outline btn-sm editBtn">تعديل</button>
            <button class="btn btn-danger btn-sm delBtn">حذف</button>
          </div>
        </div>
      </div>
    `);
    item.querySelector(".editBtn").addEventListener("click", ()=>{ STATE.adminEditing = q.id; renderAdmin(app); window.scrollTo({top:0,behavior:"smooth"}); });
    item.querySelector(".delBtn").addEventListener("click", async ()=>{
      if(!confirm("هل تريد حذف هذا السؤال نهائياً؟")) return;
      const newBank = STATE.bank.filter(x=>x.id!==q.id);
      await persistBank(newBank);
      showToast("تم حذف السؤال");
      renderAdmin(app);
    });
    listHost.appendChild(item);
  });
}

function renderQuestionForm(q, editingId){
  const form = el(`
    <div class="card" style="border-color:var(--teal);">
      <h3 style="margin-top:0;">${editingId ? "تعديل السؤال" : "سؤال جديد"}</h3>
      <div class="field">
        <label>نص السؤال</label>
        <textarea id="fQuestion" rows="2">${q.text}</textarea>
      </div>
      <div id="fOptions"></div>
      <div class="nav-row" style="margin-top:10px;">
        <div class="side">
          <button class="btn btn-primary" id="fSave">حفظ</button>
          <button class="btn btn-outline" id="fCancel">إلغاء</button>
        </div>
      </div>
    </div>
  `);
  const optHost = form.querySelector("#fOptions");
  q.options.forEach((opt,idx)=>{
    const line = el(`
      <div class="admin-opt-line">
        <input type="radio" name="fCorrect" value="${idx}" ${q.correct===idx?"checked":""}>
        <span class="opt-letter" style="font-family:Cairo,sans-serif;font-weight:800;width:20px;">${LETTERS[idx]}.</span>
        <input type="text" class="fOptText" value="${opt}" style="flex:1;">
      </div>
    `);
    optHost.appendChild(line);
  });

  form.querySelector("#fCancel").addEventListener("click", ()=>{ STATE.adminEditing=null; renderAdmin(document.getElementById("app")); });
  form.querySelector("#fSave").addEventListener("click", async ()=>{
    const text = form.querySelector("#fQuestion").value.trim();
    const opts = Array.from(form.querySelectorAll(".fOptText")).map(i=>i.value.trim());
    const correctVal = form.querySelector("input[name=fCorrect]:checked");
    if(!text || opts.some(o=>!o) || !correctVal){
      showToast("يرجى تعبئة نص السؤال وجميع البدائل الأربعة وتحديد الإجابة الصحيحة");
      return;
    }
    const correct = parseInt(correctVal.value,10);
    let newBank;
    if(editingId){
      newBank = STATE.bank.map(x=> x.id===editingId ? {...x, text, options:opts, correct} : x);
    } else {
      const newId = "q_" + Date.now();
      newBank = [...STATE.bank, {id:newId, text, options:opts, correct}];
    }
    await persistBank(newBank);
    STATE.adminEditing = null;
    showToast("تم الحفظ بنجاح");
    renderAdmin(document.getElementById("app"));
  });

  return form;
}

/* =========================================================
   BOOT
========================================================= */
(async function boot(){
  await initData();
  render();

  const copyBtn = document.getElementById("copyLinkBtn");
  if(copyBtn){
    copyBtn.addEventListener("click", async ()=>{
      const link = window.location.href;
      try{
        await navigator.clipboard.writeText(link);
        showToast("تم نسخ رابط الامتحان");
      }catch(e){
        // fallback for browsers/contexts without Clipboard API permission
        try{
          const ta = document.createElement("textarea");
          ta.value = link;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          showToast("تم نسخ رابط الامتحان");
        }catch(e2){
          showToast("تعذر النسخ التلقائي، انسخ الرابط من شريط العنوان");
        }
      }
    });
  }
})();
</script>
</body>
</html>
